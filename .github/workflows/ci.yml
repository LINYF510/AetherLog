# AetherLog CI：每次推送 / PR 自动构建 + 类型检查
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: node esbuild.config.mjs

      - name: Verify build artifacts
        run: |
          test -f dist/main.js || { echo "dist/main.js not found"; exit 1; }
          test -f dist/styles.css || { echo "dist/styles.css not found"; exit 1; }
          echo "✅ Build artifacts verified"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: aetherlog-build
          path: |
            dist/main.js
            dist/styles.css
            manifest.json
          retention-days: 7
